[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/VeoveoAI/veoveo-mcp-n8n"
publish = false

[workspace.dependencies]
tempfile = "=3.27.0"
# veoveo-core, pinned to one revision for every core crate: the revision the SDK pins.
veoveo-fixtures = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "4ebcf890eae077cdaf28dacdfab6650f1e5c4e30" }
veoveo-store = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "4ebcf890eae077cdaf28dacdfab6650f1e5c4e30" }
veoveo-task = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "4ebcf890eae077cdaf28dacdfab6650f1e5c4e30" }
veoveo-types = { git = "https://github.com/VeoveoAI/veoveo-core", rev = "4ebcf890eae077cdaf28dacdfab6650f1e5c4e30" }
# The Rust SDK for Veoveo MCP servers: the contract feature for declarations, the server
# feature for hosting, registration, the forwarded identity and the server's surfaces.
veoveo-hub-sdk = { git = "https://github.com/VeoveoAI/veoveo-hub-sdk", rev = "7459481c6c53258296e3e96682fdfc1e4ac1e68a", default-features = false }

anyhow = "=1.0.104"
# The SDK's router; the server's own routes, such as the hooks, are axum routers.
axum = "0.8.9"
# n8n's executions cursor; the release veoveo-core pins.
base64 = "=0.23.1"
# n8n's owner password reaches n8n only as its bcrypt hash.
bcrypt = "=0.19.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
# The release veoveo-core pins; the server's generated secrets come from the OS.
getrandom = "=0.4.3"
hex = "=0.4.3"
# The SDK's HTTP client release; registration, n8n's client and the tests share it.
reqwest = { version = "=0.13.5", default-features = false }
# The rmcp fork the SDK pins; the tool router uses its macros.
rmcp = { version = "=3.5.0", git = "https://github.com/VeoveoAI/rust-sdk", rev = "faa4e9d57dcb834740b6053c483ed2de7b8b8076" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10.3"
sha2 = "=0.11.0"
toml = "=1.1.8"
tracing = "0.1.44"
url = "=2.5.8"

schemars = { version = "1.2.2", features = ["uuid1"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# PostgreSQL 18 through the same sqlx release and features as veoveo-core. `sqlx-toml`
# reads the crate's migration table from its `sqlx.toml`.
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "chrono", "json", "migrate", "macros", "sqlx-toml"] }
thiserror = "=2.0.21"
tokio = "1.53.1"
tokio-util = "0.7.19"
futures = "0.3.34"
uuid = { version = "1.24.1", default-features = false, features = ["serde", "std", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
