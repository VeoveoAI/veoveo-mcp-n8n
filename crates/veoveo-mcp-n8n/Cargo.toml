[package]
name = "veoveo-mcp-n8n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
# The server's public types: workflow names, execution IDs, resource addresses, results
# and the permission vocabulary. No database or runtime dependency.
contract = [
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:thiserror",
    "dep:veoveo-hub-sdk",
    "dep:veoveo-types",
]
# The hosted server: MCP through the SDK, n8n's supervision and client, persistence in
# the `n8n` schema and the binary.
server = [
    "contract",
    "veoveo-hub-sdk/server",
    "dep:anyhow",
    "dep:axum",
    "dep:base64",
    "dep:bcrypt",
    "dep:chrono",
    "dep:clap",
    "dep:dotenvy",
    "dep:getrandom",
    "dep:hex",
    "dep:nix",
    "dep:reqwest",
    "dep:rmcp",
    "dep:rustls",
    "dep:secrecy",
    "dep:serde_json",
    "dep:sha2",
    "dep:sqlx",
    "dep:tokio",
    "tokio/rt-multi-thread",
    "tokio/macros",
    "tokio/signal",
    "tokio/process",
    "tokio/fs",
    "tokio/io-util",
    "tokio/sync",
    "tokio/time",
    "dep:toml",
    "dep:tracing",
    "dep:url",
    "dep:uuid",
    "dep:veoveo-skills",
    "dep:veoveo-store",
    "dep:veoveo-task",
    "dep:tokio-util",
    "dep:futures",
]

[build-dependencies]
# Embeds the skills under skills/ at build time.
veoveo-skills = { workspace = true, features = ["build"] }

[dependencies]
veoveo-skills = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
veoveo-hub-sdk = { workspace = true, features = ["contract"], optional = true }
veoveo-types = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bcrypt = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
# SIGTERM to n8n's process when the server stops.
nix = { version = "=0.31.3", default-features = false, features = ["signal"], optional = true }
reqwest = { workspace = true, features = ["rustls-no-provider", "stream"], optional = true }
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-streamable-http-server"], optional = true }
rustls = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time", "net"] }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
veoveo-store = { workspace = true, optional = true }
veoveo-task = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
reqwest.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "schemars"] }
rustls.workspace = true
schemars.workspace = true
serde.workspace = true
secrecy.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio-util.workspace = true
tower = "0.5.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url.workspace = true
uuid.workspace = true
veoveo-store.workspace = true
veoveo-task.workspace = true
veoveo-types.workspace = true
veoveo-hub-sdk = { workspace = true, features = ["server", "testing"] }
# `database-conformance` holds the crate's queries and schema to core's database rules.
veoveo-fixtures = { workspace = true, features = ["store", "database-conformance"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }

[[bin]]
name = "veoveo-mcp-n8n"
required-features = ["server"]

[[bin]]
name = "veoveo-n8n-computer"
path = "src/bin/veoveo-n8n-computer.rs"
required-features = ["server"]

[[test]]
name = "database_conformance"
required-features = ["server"]

[[test]]
name = "mcp"
required-features = ["server"]

[[test]]
name = "runs"
required-features = ["server"]

[[test]]
name = "bridge"
required-features = ["server"]

[[test]]
name = "sql_confinement"
required-features = ["server"]

[[test]]
name = "workflows"
required-features = ["server"]

[[test]]
name = "team"
required-features = ["server"]

[[test]]
name = "computer"
required-features = ["server"]
