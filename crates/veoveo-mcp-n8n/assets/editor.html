<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>n8n</title>
<style>
  html, body { margin: 0; height: 100%; background: #f5f5f5; font: 14px/1.4 system-ui, sans-serif; color: #333; }
  body.dark { background: #1e1e1e; color: #ddd; }
  #status { padding: 16px; }
  #editor { display: none; border: 0; width: 100%; height: 100%; }
  body.framed #editor { display: block; }
  body.framed #status { display: none; }
</style>
</head>
<body>
<div id="status">Opening n8n's editor…</div>
<iframe id="editor" title="n8n's editor" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
<script>
(() => {
  "use strict";
  // The view of ui://n8n/editor under MCP Apps 2026-01-26: it reads n8n://editor from its
  // own server through the host and frames the editor URL it names, the server's app
  // origin, which the App's UI metadata declares as its one frame domain.
  const APPS_PROTOCOL = "2026-01-26";
  const APP_INFO = { name: "n8n editor", version: "1" };
  const REQUEST_TIMEOUT_MS = 30000;
  const pending = new Map();
  let nextId = 1;
  let tornDown = false;

  const post = (message) => window.parent.postMessage(message, "*");
  const notify = (method, params) => { if (!tornDown) post({ jsonrpc: "2.0", method, params }); };
  const status = (text) => { document.getElementById("status").textContent = text; };

  function request(method, params) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { pending.delete(id); reject(new Error(`the host did not answer ${method}`)); }, REQUEST_TIMEOUT_MS);
      pending.set(id, { resolve, reject, timer });
      post({ jsonrpc: "2.0", id, method, params });
    });
  }

  function applyHostContext(context) {
    document.body.classList.toggle("dark", !!context && context.theme === "dark");
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || typeof message !== "object" || message.jsonrpc !== "2.0") return;
    if (typeof message.method === "string") {
      if (message.id !== undefined && message.id !== null) {
        if (message.method === "ui/resource-teardown") { tornDown = true; post({ jsonrpc: "2.0", id: message.id, result: {} }); }
        else if (message.method === "ping") post({ jsonrpc: "2.0", id: message.id, result: {} });
        else post({ jsonrpc: "2.0", id: message.id, error: { code: -32601, message: `the editor view does not handle ${message.method}` } });
      } else if (message.method === "ui/notifications/host-context-changed") {
        applyHostContext(message.params || {});
      }
      return;
    }
    const call = pending.get(message.id);
    if (!call) return;
    pending.delete(message.id);
    clearTimeout(call.timer);
    if (message.error) call.reject(new Error(message.error.message || "the host refused the request"));
    else call.resolve(message.result);
  });

  async function start() {
    let initialized;
    try {
      initialized = await request("ui/initialize", {
        protocolVersion: APPS_PROTOCOL,
        appInfo: APP_INFO,
        appCapabilities: { availableDisplayModes: ["fullscreen"] },
      });
    } catch (error) {
      status(`The editor could not connect to its host: ${error.message}`);
      return;
    }
    applyHostContext(initialized && initialized.hostContext);
    notify("ui/notifications/initialized", {});
    request("ui/request-display-mode", { mode: "fullscreen" }).catch(() => {});
    let editor;
    try {
      const read = await request("resources/read", { uri: "n8n://editor" });
      editor = JSON.parse(read.contents[0].text);
    } catch (error) {
      status(`The editor's address could not be read: ${error.message}`);
      return;
    }
    const url = new URL(editor.editorUrl);
    if (url.protocol !== "https:" && url.hostname !== "localhost") {
      status("The editor's address is not an HTTPS origin.");
      return;
    }
    const frame = document.getElementById("editor");
    frame.src = url.href;
    document.body.classList.add("framed");
    notify("ui/notifications/size-changed", { height: window.innerHeight });
  }

  start();
})();
</script>
</body>
</html>
