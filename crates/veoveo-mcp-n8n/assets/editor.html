<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>n8n</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 16px; font: 14px/1.5 system-ui, sans-serif; color: #222; background: transparent; }
  body.dark { color: #e8e8e8; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  code { word-break: break-all; }
  button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid #ea4b71; background: #ea4b71; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #error { color: #c62828; }
</style>
</head>
<body>
<h1>n8n's editor</h1>
<p id="status">Reading the editor's address…</p>
<p><button id="open" type="button" disabled>Open n8n's editor</button></p>
<p id="error" hidden></p>
<script>
(() => {
  "use strict";
  // The view of ui://n8n/editor under MCP Apps 2026-01-26: a self-contained launcher. It
  // reads n8n://editor from its own server through the host, shows the editor's URL and,
  // when the person asks, opens the server's app origin top-level with ui/open-link. It
  // frames nothing: this view runs in a frame sandboxed allow-scripts alone, which a
  // nested frame would inherit, so the editor would hold no session of its own there.
  const APPS_PROTOCOL = "2026-01-26";
  const APP_INFO = { name: "n8n editor", version: "1" };
  const REQUEST_TIMEOUT_MS = 30000;
  const pending = new Map();
  let nextId = 1;
  let tornDown = false;
  let editorUrl = null;

  const $ = (id) => document.getElementById(id);
  const post = (message) => window.parent.postMessage(message, "*");
  const notify = (method, params) => { if (!tornDown) post({ jsonrpc: "2.0", method, params }); };
  const showError = (text) => { $("error").textContent = text; $("error").hidden = false; };

  function request(method, params) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { pending.delete(id); reject(new Error(`the host did not answer ${method}`)); }, REQUEST_TIMEOUT_MS);
      pending.set(id, { resolve, reject, timer });
      post({ jsonrpc: "2.0", id, method, params });
    });
  }

  function applyHostContext(context) {
    document.body.classList.toggle("dark", !!context && context.theme === "dark");
  }

  function reportSize() {
    notify("ui/notifications/size-changed", { height: document.documentElement.scrollHeight });
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || typeof message !== "object" || message.jsonrpc !== "2.0") return;
    if (typeof message.method === "string") {
      if (message.id !== undefined && message.id !== null) {
        if (message.method === "ui/resource-teardown") { tornDown = true; post({ jsonrpc: "2.0", id: message.id, result: {} }); }
        else if (message.method === "ping") post({ jsonrpc: "2.0", id: message.id, result: {} });
        else post({ jsonrpc: "2.0", id: message.id, error: { code: -32601, message: `the editor view does not handle ${message.method}` } });
      } else if (message.method === "ui/notifications/host-context-changed") {
        applyHostContext(message.params || {});
      }
      return;
    }
    const call = pending.get(message.id);
    if (!call) return;
    pending.delete(message.id);
    clearTimeout(call.timer);
    if (message.error) call.reject(new Error(message.error.message || "the host refused the request"));
    else call.resolve(message.result);
  });

  async function openEditor() {
    if (!editorUrl) return;
    $("error").hidden = true;
    try {
      // A person's click: the host may open the origin in a new tab.
      const result = await request("ui/open-link", { url: editorUrl });
      if (result && result.isError) showError("The host did not open the editor.");
    } catch (error) {
      showError(`The host did not open the editor: ${error.message}`);
    }
    reportSize();
  }

  async function start() {
    $("open").addEventListener("click", openEditor);
    let initialized;
    try {
      initialized = await request("ui/initialize", {
        protocolVersion: APPS_PROTOCOL,
        appInfo: APP_INFO,
        appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
      });
    } catch (error) {
      $("status").textContent = "";
      showError(`The editor could not connect to its host: ${error.message}`);
      return;
    }
    applyHostContext(initialized && initialized.hostContext);
    notify("ui/notifications/initialized", {});
    try {
      const read = await request("resources/read", { uri: "n8n://editor" });
      const editor = JSON.parse(read.contents[0].text);
      const url = new URL(editor.editorUrl);
      if (url.protocol !== "https:") throw new Error("the editor's address is not an HTTPS origin");
      editorUrl = url.origin + "/";
    } catch (error) {
      $("status").textContent = "";
      showError(`The editor's address could not be read: ${error.message}`);
      reportSize();
      return;
    }
    $("status").innerHTML = "";
    $("status").append("The editor opens on its own origin, ");
    const code = document.createElement("code");
    code.textContent = editorUrl;
    $("status").append(code, ", and acts in n8n as its owner.");
    $("open").disabled = false;
    reportSize();
  }

  start();
})();
</script>
</body>
</html>
