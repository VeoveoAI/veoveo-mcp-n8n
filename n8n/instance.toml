# The n8n instance this branch runs. It never holds a credential value: each secret field
# of a credential names the provider environment variable whose placeholder fills it.

# The one tenant the branch serves; a caller of another tenant is refused.
tenant = "reference"

# The node types n8n loads; it loads no other. n8n's command, SSH, Git, local-file and MCP
# nodes are refused whatever this list says.
nodes = [
  "n8n-nodes-base.webhook",
  "n8n-nodes-base.respondToWebhook",
  "n8n-nodes-base.manualTrigger",
  "n8n-nodes-base.set",
  "n8n-nodes-base.noOp",
  "n8n-nodes-base.wait",
  "n8n-nodes-base.stickyNote",
]

# Credentials the server imports at every start with `n8n import:credentials`, under the
# same ID, so workflows name them. For example:
#
# [[credentials]]
# id = "githubToken0001"
# name = "GitHub"
# type = "githubApi"
# data = { server = "https://api.github.com", user = "veoveo" }
# secrets = { accessToken = "GITHUB_TOKEN" }
