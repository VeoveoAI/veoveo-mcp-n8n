# This team's n8n instance. The n8n repository links this repository at the top level of
# a branch; the runner of that link applies workflows/ to its own n8n. This file never
# holds a credential value: each secret field of a credential names the provider
# environment variable whose placeholder fills it.

# The one tenant the team serves; a caller of another tenant is refused.
tenant = "reference"

# The node types the team's workflows use, beside the Veoveo nodes, which every runner
# loads. Without `nodes`, the team uses every node type the n8n repository's
# n8n/admitted.toml admits. A team may narrow it to the ones its workflows use, each
# admitted there; `nodes = []` is the Veoveo nodes alone. For example:
#
# nodes = ["n8n-nodes-base.webhook", "n8n-nodes-base.set"]

# Credentials the runner imports at every start with `n8n import:credentials`, under the
# same ID, so workflows name them. The n8n repository must admit their types, as it does
# every type when its n8n/admitted.toml sets `credentials = "all"`. For example:
#
# [[credentials]]
# id = "githubToken0001"
# name = "GitHub"
# type = "githubApi"
# data = { server = "https://api.github.com", user = "veoveo" }
# secrets = { accessToken = "GITHUB_TOKEN" }
